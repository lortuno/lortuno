<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="robots" content="noindex">
	<title>404 · Laura Ortuño López</title>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@700&display=swap">
	<style>
		:root { --bg: #f6f7f9; --ink: #0f1b2d; --muted: #66758a; --accent: #0f6e8c; --accent-ink: #fff; }
		@media (prefers-color-scheme: dark) {
			:root { --bg: #0a111c; --ink: #e8eef5; --muted: #8595a8; --accent: #4fd1c5; --accent-ink: #062226; }
		}
		* { box-sizing: border-box; }
		body {
			margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
			background: var(--bg); color: var(--ink); font-family: Inter, system-ui, sans-serif; text-align: center;
		}
		h1 {
			margin: 0; font-family: "Space Grotesk", sans-serif; font-size: clamp(96px, 22vw, 180px); line-height: 1;
			background: linear-gradient(90deg, var(--accent), #7c4dff); -webkit-background-clip: text; background-clip: text; color: transparent;
		}
		p { max-width: 46ch; margin: 16px auto 0; color: var(--muted); }
		.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 32px; }
		a {
			display: inline-block; padding: 12px 22px; border-radius: 999px; font-weight: 600; text-decoration: none;
			background: var(--accent); color: var(--accent-ink);
		}
		a.ghost { background: transparent; color: var(--ink); border: 1px solid currentColor; }
	</style>
</head>
<body>
	<main>
		<h1>404</h1>
		<p>La página que buscas no existe o se ha movido.<br>The page you're looking for doesn't exist or has moved.</p>
		<div class="actions">
			<a id="home-es" href="es.html">Volver al inicio</a>
			<a id="home-en" class="ghost" href="../index.html">Back to home</a>
		</div>
	</main>
	<script>
		// On GitHub Pages this page can be served at any depth; point links at the site root.
		(function () {
			var base = "/";
			if (/\.github\.io$/.test(location.hostname)) {
				var first = location.pathname.split("/")[1];
				if (first) base = "/" + first + "/";
			}
			document.getElementById("home-es").href = base + "src/es.html";
			document.getElementById("home-en").href = base;
		})();
	</script>
</body>
</html>
